spring.application.name=loans_manager

# DATABASE
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/loan_app_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database=POSTGRESQL


# SERVER
server.port=${PORT:8081}


# SECURITY / JWT
jwt.secret-key=${JWT_SECRET_KEY}

jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

jwt.cookie.path=/
jwt.cookie.secure=${JWT_COOKIE_SECURE:false}
jwt.cookie.same-site=${JWT_COOKIE_SAME_SITE:Lax}


# FRONTEND
app.frontend-url=${FRONTEND_URL:http://localhost:4200}